<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALD Process Control</title>
<link rel="stylesheet" href="css/tokens.css?v=__ASSET_V__">
<link rel="stylesheet" href="css/style.css?v=__ASSET_V__">
</head>
<body>
<div id="stage">
  <div id="app">

    <!-- ===================== 헤더 ===================== -->
    <header>
      <span class="badge" data-bind="chamberBadge">ALD</span>
      <div class="hdr-title">
        <h1>ALD 공정 제어</h1>
        <div class="sub" data-bind="chamberSub">&mdash;</div>
      </div>
      <div class="hdr-spacer"></div>
      <div class="hdr-right">
        <span class="chip neutral" data-bind="statePill"><span class="dot"></span><span data-bind="statePillText">대기</span></span>
        <span class="chip neutral" data-bind="alarmChip">알람 없음</span>
        <span class="chip warn" data-bind="demoChip" hidden>데모</span>
        <div class="clock">
          <div class="t mono" data-bind="clock">--:--:--</div>
          <div class="d mono" data-bind="date">&mdash;</div>
        </div>
      </div>
    </header>

    <!-- ===================== 탭 바 ===================== -->
    <nav class="tabbar">
      <button class="tab on" data-tab="main">운전</button>
      <button class="tab" data-tab="recipe">레시피</button>
      <button class="tab" data-tab="trend">트렌드</button>
      <button class="tab" data-tab="alarm">알람·로그</button>
      <button class="tab" data-tab="setup">설정</button>
      <span class="access" data-bind="access">조작 권한: 이 PC</span>
    </nav>

    <!-- ===================== 뷰 ===================== -->
    <div class="views">

      <!-- ---------- 운전 ---------- -->
      <section class="view on" id="view-main">
        <div class="row grow">
          <div class="panel" style="flex:0 0 616px">
            <div class="panel-head">배관도<span class="note" data-bind="schemNote">&mdash;</span></div>
            <div class="panel-body flush col">
              <div class="schem-wrap"><svg id="schemSvg" viewBox="0 0 600 470" preserveAspectRatio="xMidYMid meet"></svg></div>
              <div class="legend" data-bind="schemLegend"></div>
            </div>
          </div>
          <div class="col grow">
            <div class="panel grow">
              <div class="panel-head" data-bind="procTitle">공정 진행
                <span class="note"><span class="chip neutral" data-bind="procPill">대기</span></span>
              </div>
              <div class="panel-body" data-bind="procBody"></div>
            </div>
            <div class="panel" style="flex:0 0 auto">
              <div class="panel-head">압력 · 배기 · 인터락</div>
              <div class="panel-body" data-bind="vacBody"></div>
            </div>
          </div>
        </div>
        <div class="row" style="flex:0 0 310px">
          <div class="panel grow">
            <div class="panel-head">히터 · 온도<span class="note">온도조절기 PID</span></div>
            <div class="panel-body tight"><table class="tbl" data-bind="heaterTbl"></table></div>
          </div>
          <div class="panel grow">
            <div class="panel-head">MFC · 유량<span class="note" data-bind="mfcTotal">&mdash;</span></div>
            <div class="panel-body tight">
              <table class="tbl" data-bind="mfcTbl"></table>
              <div class="hint" style="margin-top:8px" data-bind="mfcNote"></div>
            </div>
          </div>
        </div>
        <div class="cmdbar">
          <button class="btn" data-cmd="pump">펌핑</button>
          <button class="btn" data-cmd="vent">벤트</button>
          <button class="btn" data-cmd="all_close">전체 밸브 닫기</button>
          <button class="btn primary" data-cmd="heater_apply">히터 SV 적용</button>
          <span class="lockmsg" data-bind="lockMsg"></span>
          <button class="btn danger-line" data-cmd="exit">프로그램 종료</button>
        </div>
      </section>

      <!-- ---------- 레시피 ---------- -->
      <section class="view" id="view-recipe">
        <div class="row grow">
          <div class="panel" style="flex:0 0 232px">
            <div class="panel-head">레시피 목록<span class="note" data-bind="recipeCount">&mdash;</span></div>
            <div class="panel-body col">
              <input class="inp" data-bind="recipeSearch" placeholder="레시피 검색">
              <div class="rlist grow" data-bind="recipeList" style="overflow:auto;margin-top:8px"></div>
              <div class="col" style="flex:0 0 auto;margin-top:8px">
                <button class="btn" data-cmd="recipe_new">새 레시피</button>
                <button class="btn" data-cmd="recipe_saveas">다른 이름으로 저장</button>
                <button class="btn danger-line" data-cmd="recipe_delete">삭제</button>
              </div>
            </div>
          </div>
          <div class="col grow" style="overflow:auto">
            <div class="panel" style="flex:0 0 auto">
              <div class="panel-head">레시피 정보
                <span class="note"><button class="btn sm" data-cmd="recipe_revert">되돌리기</button>
                <button class="btn sm primary" data-cmd="recipe_save">저장</button></span>
              </div>
              <div class="panel-body" data-bind="recipeInfo"></div>
            </div>
            <div class="notice-strip" data-bind="recipeRunning" hidden></div>
            <div class="panel" style="flex:0 0 auto">
              <div class="panel-head">블록 구성
                <span class="note"><button class="btn sm" data-cmd="block_add">+ 블록</button>
                <button class="btn sm" data-cmd="group_add">반복 그룹</button></span>
              </div>
              <div class="panel-body tight"><table class="tbl" data-bind="blockTbl"></table>
                <div class="hint" style="margin-top:8px" data-bind="groupNote"></div></div>
            </div>
            <div class="panel" style="flex:0 0 auto">
              <div class="panel-head" data-bind="stepHead">블록 &mdash;
                <span class="note"><button class="btn sm" data-cmd="step_add">+ 스텝</button>
                <button class="btn sm danger-line" data-cmd="step_del">삭제</button></span>
              </div>
              <div class="panel-body tight"><table class="tbl" data-bind="stepTbl"></table></div>
            </div>
            <div class="panel" style="flex:0 0 auto">
              <div class="panel-head" data-bind="detailHead">스텝 상세</div>
              <div class="panel-body" data-bind="stepDetail"></div>
            </div>
          </div>
        </div>
        <div class="verify-strip" data-bind="verify">&mdash;</div>
      </section>

      <!-- ---------- 트렌드 ---------- -->
      <section class="view" id="view-trend">
        <div class="trendbar">
          <button class="btn sm primary" data-range="120">2분</button>
          <button class="btn sm" data-range="600">10분</button>
          <button class="btn sm" data-range="3600">1시간</button>
          <button class="btn sm" data-range="all" disabled title="다음 단계에서 구현됩니다">공정 전체</button>
          <label class="chip ok" style="cursor:pointer"><input type="checkbox" data-bind="autoScroll" checked hidden><span class="dot"></span>자동 스크롤</label>
          <span class="right">
            <span class="mono" data-bind="trendInfo">&mdash;</span>
            <button class="btn sm" data-cmd="csv" disabled title="다음 단계에서 구현됩니다">CSV 내보내기</button>
          </span>
        </div>
        <div class="panel chartpanel">
          <div class="panel-head">공정 압력 · Baratron (Torr)<span class="legend-inline" data-bind="lgP"></span></div>
          <div class="panel-body"><canvas data-chart="p"></canvas></div>
        </div>
        <div class="panel chartpanel">
          <div class="panel-head">온도 (°C)<span class="legend-inline" data-bind="lgT"></span></div>
          <div class="panel-body"><canvas data-chart="t"></canvas></div>
        </div>
        <div class="panel chartpanel">
          <div class="panel-head">MFC 유량 (sccm)<span class="legend-inline" data-bind="lgM"></span></div>
          <div class="panel-body"><canvas data-chart="m"></canvas></div>
        </div>
        <div id="tip" hidden></div>
      </section>

      <!-- ---------- 알람 · 로그 ---------- -->
      <section class="view" id="view-alarm">
        <div class="panel" style="flex:0 0 auto">
          <div class="panel-head">현재 알람
            <span class="note"><span data-bind="alarmCount">&mdash;</span>
            <button class="btn sm" data-cmd="alarm_ack_all">전체 확인</button>
            <button class="btn sm" data-cmd="alarm_reset">알람 리셋</button></span>
          </div>
          <div class="panel-body tight"><table class="tbl" data-bind="alarmTbl"></table>
            <div class="hint" style="margin-top:10px" data-bind="alarmHint"></div></div>
        </div>
        <div class="panel" style="flex:0 0 232px">
          <div class="panel-head">알람 이력</div>
          <div class="panel-body tight"><table class="tbl" data-bind="histTbl"></table></div>
        </div>
        <div class="panel grow">
          <div class="panel-head">공정 로그<span class="note" data-bind="logNote"></span></div>
          <div class="panel-body"><div class="logbox" data-bind="logBox"></div></div>
        </div>
      </section>

      <!-- ---------- 설정 ---------- -->
      <section class="view" id="view-setup">
        <div class="row grow" style="overflow:auto">
          <div class="col grow" data-bind="setupLeft"></div>
          <div class="col grow" data-bind="setupRight"></div>
        </div>
      </section>

    </div>

    <!-- ===================== 상태줄 ===================== -->
    <div class="statusbar">
      <span class="dot" data-bind="sbDot"></span>
      <span data-bind="sbText">&mdash;</span>
      <span class="right mono" data-bind="sbVer">&mdash;</span>
    </div>
  </div>
</div>

<div id="toasts"></div>
<div class="modal" id="exitModal" hidden>
  <div class="modal-box">
    <h3>프로그램을 종료할까요?</h3>
    <p data-bind="exitMsg">종료하면 화면 감시가 멈춥니다. 장비는 PLC 안전 로직이 계속 관리합니다.</p>
    <div class="modal-btns">
      <button class="btn" data-cmd="exit_cancel">취소</button>
      <button class="btn danger" data-cmd="exit_confirm">종료</button>
    </div>
  </div>
</div>

<script src="js/fmt.js?v=__ASSET_V__"></script>
<script src="js/core.js?v=__ASSET_V__"></script>
<script src="js/app.js?v=__ASSET_V__"></script>
<script src="js/views/schematic.js?v=__ASSET_V__"></script>
<script src="js/views/main.js?v=__ASSET_V__"></script>
<script src="js/views/recipe.js?v=__ASSET_V__"></script>
<script src="js/views/trend.js?v=__ASSET_V__"></script>
<script src="js/views/alarm.js?v=__ASSET_V__"></script>
<script src="js/views/setup.js?v=__ASSET_V__"></script>
</body>
</html>
